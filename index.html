<h1>助教</h1>
<p class="sub">给老师的几个小工具。免费，不用注册，没有服务器，名单和记录只在你自己的手机里。</p>
<a class="tool" href="/dianming/" style="--ac:#3B5BA5"><b>随机点名 · 抽题</b><span>粘名单和题目，随机点一个人、抽一道题，投屏大字显示，本轮不重复。</span></a>
<a class="tool" href="/jifen/" style="--ac:#C2552B"><b>极简班级积分</b><span>点名字加减分，3 秒内可撤销，今日/本周播报一键复制到家长群。</span></a>
<a class="tool" href="/zuoye/" style="--ac:#1F6F78"><b>托管作业登记</b><span>放学后逐个孩子登记各科作业，一键生成家长反馈文案。</span></a>
<p class="foot">做这些工具的是「独立开发者老徐」。想要别的小工具，或者哪里不好用，小红书私信我。<br>建议每周点一次「备份」。</p>
